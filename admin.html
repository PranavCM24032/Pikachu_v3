<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Pykachu Hunt - Admin</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4361ee">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => { });
            });
        }
    </script>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="min-h-screen flex flex-col">
    <div class="cyber-grid"></div>

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 border-b border-indigo-500/20" style="padding-top: var(--safe-top);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between container-padding">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse absolute -top-1 -right-1"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-indigo-400" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <div>
                    <h1
                        class="font-pixel text-responsive bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                        Pikachu<span class="text-white">Hunt</span></h1>
                    <p class="text-[10px] text-slate-500 font-mono tracking-widest uppercase hidden sm:block">Admin
                        Command Node</p>
                    <p class="text-[8px] text-slate-500 font-mono tracking-widest uppercase sm:hidden">ADMIN</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div
                    class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/50 border border-slate-700">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span id="systemStatus" class="text-xs font-mono text-green-400">ONLINE</span>
                </div>

                <!-- Mobile Compact Buttons -->
                <div class="flex sm:hidden items-center gap-1">
                    <button onclick="clearCache()" id="clearBtn"
                        class="group relative p-2 bg-amber-600 hover:bg-amber-500 transition-all rounded-lg overflow-hidden">
                        <div class="flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </div>
                    </button>

                    <button onclick="toggleAutoRefresh()" id="refreshBtn"
                        class="group relative p-2 bg-indigo-600 hover:bg-indigo-500 transition-all rounded-lg overflow-hidden">
                        <div class="flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                </path>
                            </svg>
                        </div>
                    </button>

                    <button onclick="wipeData()" id="wipeBtn"
                        class="group relative p-2 bg-red-600 hover:bg-red-500 transition-all rounded-lg overflow-hidden">
                        <div class="flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 6h18M9 6v12m6-12v12M5 6l1 14a2 2 0 002 2h8a2 2 0 002-2l1-14" />
                            </svg>
                        </div>
                    </button>
                </div>

                <!-- Desktop Buttons -->
                <div class="hidden sm:flex items-center gap-2">
                    <button onclick="clearCache()" id="clearBtn"
                        class="group relative px-3 py-2 bg-amber-600 hover:bg-amber-500 transition-all rounded-lg overflow-hidden">
                        <div
                            class="absolute inset-0 bg-white/20 group-hover:translate-x-full duration-500 transform -skew-x-12 -translate-x-full">
                        </div>
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            <span class="text-xs font-bold text-white">CLEAR</span>
                        </div>
                    </button>

                    <button onclick="toggleAutoRefresh()" id="refreshBtn"
                        class="group relative px-3 py-2 bg-indigo-600 hover:bg-indigo-500 transition-all rounded-lg overflow-hidden">
                        <div
                            class="absolute inset-0 bg-white/20 group-hover:translate-x-full duration-500 transform -skew-x-12 -translate-x-full">
                        </div>
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                </path>
                            </svg>
                            <span class="text-xs font-bold text-white">SYNC</span>
                        </div>
                    </button>

                    <button onclick="wipeData()" id="wipeBtn"
                        class="group relative px-3 py-2 bg-red-600 hover:bg-red-500 transition-all rounded-lg overflow-hidden">
                        <div
                            class="absolute inset-0 bg-white/20 group-hover:translate-x-full duration-500 transform -skew-x-12 -translate-x-full">
                        </div>
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 6h18M9 6v12m6-12v12M5 6l1 14a2 2 0 002 2h8a2 2 0 002-2l1-14" />
                            </svg>
                            <span class="text-xs font-bold text-white">WIPE</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main
        class="flex-1 max-w-7xl mx-auto w-full p-3 sm:p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 container-padding">
        <!-- Sidebar Stats - Mobile: Full width, Desktop: 3 columns -->
        <aside class="lg:col-span-3 space-y-4">
            <!-- Active Teams Card -->
            <div class="glass-panel p-4 sm:p-5 rounded-xl border-l-4 border-indigo-500">
                <div class="flex justify-between items-start mb-2">
                    <div class="p-2 bg-indigo-500/10 rounded-lg">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                            </path>
                        </svg>
                    </div>
                    <span class="text-xs text-slate-500 font-mono">LIVE</span>
                </div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Active Teams</h3>
                <p id="teamCount" class="text-2xl sm:text-3xl font-bold text-white mt-1 font-mono">0</p>
            </div>

            <!-- Solves Card -->
            <div class="glass-panel p-4 sm:p-5 rounded-xl border-l-4 border-emerald-500">
                <div class="flex justify-between items-start mb-2">
                    <div class="p-2 bg-emerald-500/10 rounded-lg">
                        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <span class="text-xs text-slate-500 font-mono">TOTAL</span>
                </div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider">Decryptions</h3>
                <p id="badgeCount" class="text-2xl sm:text-3xl font-bold text-white mt-1 font-mono">0</p>
            </div>

            <!-- Filters -->
            <div class="glass-panel p-4 sm:p-5 rounded-xl">
                <h3 class="text-indigo-400 text-xs font-bold uppercase tracking-wider mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z">
                        </path>
                    </svg>
                    Mission Filters
                </h3>
                <div class="space-y-4">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </span>
                        <input type="text" id="teamSearch" onkeyup="renderLogs()" placeholder="Search team..."
                            class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-xs rounded-lg pl-9 pr-3 py-3 sm:py-2.5 focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>

                    <!-- Specialty Type Filter -->
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold uppercase mb-2 block">Specialty Type</label>
                        <select id="typeFilter" onchange="renderLogs()"
                            class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-lg px-3 py-3 sm:py-2 focus:border-indigo-500 outline-none">
                            <option value="ALL">ALL TYPES</option>
                            <option value="GRASS">🌿 GRASS</option>
                            <option value="FIRE">🔥 FIRE</option>
                            <option value="WATER">💧 WATER</option>
                            <option value="GROUND">🌍 GROUND</option>
                            <option value="CHARIZARD">🐲 CHARIZARD</option>
                            <option value="GRENINJA">🐸 GRENINJA</option>
                            <option value="PIKACHU">⚡ PIKACHU</option>
                        </select>
                    </div>

                    <!-- Level Filter Dropdown -->
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold uppercase mb-2 block">Level Filter</label>
                        <select id="levelFilter" onchange="renderLogs()"
                            class="w-full bg-slate-900 border border-slate-700 text-white text-xs rounded-lg px-3 py-3 sm:py-2 focus:border-indigo-500 outline-none">
                            <option value="ALL">ALL LEVELS</option>
                            <option value="L1">LEVEL 1</option>
                            <option value="L2">LEVEL 2</option>
                            <option value="L3">LEVEL 3</option>
                        </select>
                    </div>

                    <!-- New Security Filters -->
                    <div class="grid grid-cols-1 gap-2">
                        <button onclick="setSecurityFilter('ALL')" id="filterAll"
                            class="security-filter-btn w-full text-left px-3 py-3 sm:py-2 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all flex justify-between items-center group">
                            <span>Show All Activity</span>
                            <span class="bg-black/20 px-1.5 rounded text-[10px] group-hover:bg-black/40">●</span>
                        </button>
                        <button onclick="setSecurityFilter('HINT')" id="filterHint"
                            class="security-filter-btn w-full text-left px-3 py-3 sm:py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 transition-all flex justify-between items-center bg-transparent border border-slate-700/50">
                            <span>Hint Used</span>
                            <span class="text-yellow-500 text-[10px]">💡</span>
                        </button>
                        <button onclick="setSecurityFilter('MALPRACTICE')" id="filterMalpractice"
                            class="security-filter-btn w-full text-left px-3 py-3 sm:py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800 transition-all flex justify-between items-center bg-transparent border border-slate-700/50">
                            <span>Malpractice Detect</span>
                            <span class="text-red-500 text-[10px]">⚠️</span>
                        </button>
                    </div>
                </div>

                <div class="mt-6 pt-6 border-t border-slate-800">
                    <a href="https://docs.google.com/spreadsheets/d/1GTHTvOZ5WtETFXRkEn9Kd5k7L44klUmrrsW4Z1Dd8YM/edit?gid=241918859#gid=241918859"
                        target="_blank"
                        class="flex items-center justify-center gap-2 w-full py-3 sm:py-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded-lg border border-emerald-500/20 transition-all">
                        <span>OPEN MASTER GOOGLE SHEET</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Data Feed -->
        <div class="lg:col-span-9 flex flex-col h-full min-h-[400px] sm:min-h-[500px]">
            <!-- Navigation Tabs -->
            <div class="flex gap-2 mb-4 overflow-x-auto pb-2 scrollbar-hide">
                <button onclick="setActiveTab('REG')" id="tab-REG"
                    class="tab-btn active px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap">REGISTRATION</button>
                <button onclick="setActiveTab('L1')" id="tab-L1"
                    class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap">LEVEL
                    1</button>
                <button onclick="setActiveTab('L2')" id="tab-L2"
                    class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap">LEVEL
                    2</button>
                <button onclick="setActiveTab('L3')" id="tab-L3"
                    class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap">LEVEL
                    3</button>
            </div>

            <div class="glass-panel flex-1 rounded-xl overflow-hidden flex flex-col">
                <!-- Data Header -->
                <div
                    class="px-4 sm:px-6 py-3 sm:py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/40">
                    <h2 class="text-sm font-bold text-white flex items-center gap-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                        <span class="hidden sm:inline">TEAM STATUS MONITOR</span>
                        <span class="sm:hidden">MONITOR</span>
                        <span id="dataSourceIndicator" class="text-[10px] text-slate-500 font-mono ml-2">[LIVE]</span>
                    </h2>
                    <span class="text-[10px] text-slate-500 font-mono truncate pl-2" id="lastUpdated">SYNCING...</span>
                </div>

                <!-- Table Header -->
                <div
                    class="grid grid-cols-12 gap-1 px-2 py-2 sm:py-3 bg-slate-950/80 border-b border-slate-800 text-[7px] sm:text-[8px] font-bold text-slate-500 uppercase tracking-widest font-mono text-center">
                    <div class="col-span-1">#</div>
                    <div class="col-span-2 text-left">Team</div>
                    <div class="col-span-1 border-r border-slate-800">Scan</div>

                    <div class="col-span-1 text-emerald-600" title="Levels Unlocked">Prev ✓</div>
                    <div class="col-span-1 text-red-600 border-r border-slate-800" title="Unlock Errors">Prev ✕</div>

                    <div class="col-span-1 text-white">Puzzle</div>

                    <div class="col-span-1 text-red-600" title="Current Puzzle Errors">Curr ✕</div>
                    <div class="col-span-1 text-emerald-600 border-r border-slate-800" title="Current Puzzle Status">
                        Curr ✓</div>

                    <div class="col-span-1">Hint</div>
                    <div class="col-span-1">Tabs</div>
                    <div class="col-span-1">Time</div>
                </div>

                <!-- Scrollable Log Area -->
                <div id="logsContainer"
                    class="flex-1 overflow-y-auto divide-y divide-slate-800/50 bg-slate-900/20 font-mono text-xs">
                    <!-- Logs injected here -->
                    <div class="flex flex-col items-center justify-center h-40 text-slate-600 gap-2">
                        <svg class="w-8 h-8 animate-spin text-indigo-500/30" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        <span class="text-xs">ESTABLISHING UPLINK...</span>
                    </div>
                </div>

                <!-- Footer -->
                <div
                    class="px-3 py-2 bg-slate-950/50 border-t border-slate-800 text-[9px] sm:text-[10px] text-slate-600 flex justify-between font-mono">
                    <span class="truncate pr-2">SECURE: TLS_1.3</span>
                    <span class="truncate pl-2">v2.5.1</span>
                </div>
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>

</html>
