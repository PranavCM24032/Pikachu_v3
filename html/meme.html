<div id="memePlayerContainer"
    class="hidden absolute inset-0 z-[130] bg-black flex flex-col">

    <!-- Video Area -->
    <div class="flex-1 relative bg-black overflow-hidden">

        <!-- YT IFrame API mounts here -->
        <div id="memePlayerDiv" style="position:absolute;inset:0;width:100%;height:100%;"></div>

        <!-- Vignette to hide YT branding (same technique as reference) -->
        <div style="position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,0.92) 100%);pointer-events:none;z-index:10;"></div>

        <!-- Tap area: first tap = unmute audio -->
        <div onclick="memeAreaTapped()"
            style="position:absolute;inset:0;z-index:20;background:transparent;cursor:pointer;"
            title="Tap to unmute"></div>

        <!-- Playback Complete Overlay -->
        <div id="memeStatusOverlay"
            class="absolute inset-0 flex items-center justify-center bg-black/70 z-30 hidden">
            <div class="text-center px-6">
                <span class="material-symbols-rounded text-green-400 text-6xl block mb-3"
                    style="filter:drop-shadow(0 0 16px rgba(74,222,128,0.8));">check_circle</span>
                <p class="font-pixel text-white text-sm uppercase tracking-widest mb-1">Meme Complete</p>
                <p class="text-gray-400 text-[10px]">Tap back to continue</p>
            </div>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="flex-shrink-0 p-3 sm:p-4 flex justify-center bg-black">
        <button onclick="backToScanner()" onmousedown="playSound('click')"
            class="btn-pokedex flex items-center justify-center gap-2 py-3 px-6 text-sm sm:text-base">
            <span class="material-symbols-rounded text-lg">arrow_back</span>
            BACK TO SCANNER
        </button>
    </div>
</div>
