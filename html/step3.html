<div id="step3" class="flow-step h-full">
    <div class="flex flex-col h-full justify-center items-center p-3 sm:p-4 md:p-6">
        <div class="mb-4 sm:mb-6 w-full text-center shrink-0">
            <!-- Gym Badge Display -->
            <div id="step3BadgeContainer" class="gym-badge-container hidden animate-fade-in">
                <div class="badge-sparkle"></div>
                <img id="gymBadgeImg" src="" alt="Gym Badge" class="gym-badge-image">
            </div>

            <h2
                class="font-pixel text-yellow-500 mb-1 sm:mb-1.5 tracking-widest uppercase text-sm sm:text-base">
                Encryption Detected
            </h2>
            <p class=" hidden text-gray-400 text-xs sm:text-sm">Input decryption key to proceed</p>
            <p id="nextPuzzleIdDisplay" class="text-blue-500 font-pixel mt-1 text-xs"></p>
        </div>

        <form id="unlockForm" class="w-full max-w-xs sm:max-w-sm">
            <div class="mb-4 sm:mb-6">
                <label
                    class="block text-gray-500 uppercase tracking-widest mb-1.5 font-bold text-xs sm:text-sm">
                    Previous Key
                </label>
                <div class="relative group">
                    <input type="text" id="unlockCode"
                        class="w-full bg-black/40 border-2 border-gray-800 rounded-xl px-4 py-3 sm:py-4 text-white focus:border-yellow-500 focus:outline-none placeholder-gray-600 uppercase transition-all text-sm sm:text-base"
                        placeholder="ENCRYPTION KEY" autocomplete="off" required
                        autocapitalize="characters">
                    <span
                        class="material-symbols-rounded absolute right-4 top-1/2 -translate-y-1/2 text-yellow-500/50 group-focus-within:text-yellow-500 transition-colors text-lg sm:text-xl">
                        key
                    </span>
                </div>
            </div>

            <div id="unlockFeedback"
                class="hidden text-xs sm:text-sm p-3 rounded-xl mb-3 bg-red-900/20 border border-red-900/40 text-red-100 font-pixel">
            </div>

            <div class="flex gap-3">
                <button type="submit" onmousedown="playSound('click')"
                    class="btn-pokedex flex-[2] flex items-center justify-center gap-2 py-3 sm:py-4 text-sm sm:text-base"
                    style="background: linear-gradient(145deg, #F59E0B, #D97706); border-bottom: 4px solid #92400E;">
                    <span class="material-symbols-rounded text-lg sm:text-xl">lock_open</span>
                    VERIFY
                </button>

                <button type="button" onclick="backToStep2()" onmousedown="playSound('click')"
                    class="flex-1 bg-gray-800/50 border-2 border-gray-700 rounded-xl flex items-center justify-center text-gray-400 hover:text-white transition-all py-3 sm:py-4">
                    <span class="material-symbols-rounded text-lg sm:text-xl">arrow_back</span>
                </button>
            </div>
        </form>
    </div>
</div>
